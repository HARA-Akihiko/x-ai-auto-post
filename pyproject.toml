[project]
name = "x-ai-auto-post"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "apscheduler==3.11.3",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires TEST_DATABASE_URL pointing to disposable PostgreSQL"]
